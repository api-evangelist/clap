aid: clap
name: CLAP
description: CLAP (주식회사 디웨일 / Dwhale Inc.) is a South Korean SaaS company offering an
  AI-powered, customizable performance management platform for enterprises. It covers
  the full performance lifecycle — multi-rater evaluations and calibration, OKR-style
  goal setting and alignment, continuous feedback and 1-on-1 meetings, and CLAP AI
  for diagnostics, feedback drafting, and automation — with tailored reporting and
  tool integrations. CLAP serves 1,000+ companies and claims to cut the HR time spent
  on performance management by up to 80%. The company is headquartered in Gangnam,
  Seoul, and is a portfolio company of 500 Global. CLAP publishes no public API or
  developer portal; this profile captures its identity and web properties.
